[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Bot de trading quantitatif (crypto + actions) : données, indicateurs, modèles, risque, backtest walk-forward, exécution."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "arch>=6.0", "ccxt>=4.0", "yfinance>=0.2", "PyYAML>=6.0",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=7.0"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
